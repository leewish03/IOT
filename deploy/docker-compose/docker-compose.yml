services:
  orchestrator:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - ../env/backend.env
    ports:
      - "8080:8080"
    volumes:
      - ../../policies:/app/policies:ro
      - orchestrator-data:/app/data
    # Optional Pi camera for scene capture (uncomment + set CAMERA_DEVICE in backend.env):
    # devices:
    #   - "${CAMERA_DEVICE:-/dev/video0}:/dev/video0"
    depends_on:
      - mqtt
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    env_file:
      - ../env/web.env
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    restart: unless-stopped

volumes:
  orchestrator-data:
  mqtt-data:
  mqtt-log:
