services:
  orchestrator:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - ../env/backend.env
    ports:
      - "8080:8080"
    volumes:
      - ../../policies:/app/policies:ro
      - orchestrator-data:/app/data
    depends_on:
      - mqtt

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log

volumes:
  orchestrator-data:
  mqtt-data:
  mqtt-log:
