# Render Blueprint — Jarvis IoT stack
# https://render.com/docs/blueprint-spec
#
# Cross-service env (fromService):
#   iot-dashboard.ORCHESTRATOR_URL  ← iot-orchestrator (hostport)
#   iot-dashboard.ORCHESTRATOR_TOKEN ← iot-orchestrator.BACKEND_API_TOKEN
#
# After first deploy, set iot-orchestrator.CORS_ORIGINS to the dashboard public URL
# (e.g. https://iot-dashboard.onrender.com) if the default hostname differs.

services:
  - type: web
    name: iot-orchestrator
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://iot-dashboard.onrender.com
      - key: BACKEND_API_TOKEN
        generateValue: true
      - key: SCENE_FPS_LIMIT
        value: "1.0"

  - type: web
    name: iot-dashboard
    runtime: node
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    plan: starter
    envVars:
      # Linked to iot-orchestrator (Render injects at deploy)
      - key: ORCHESTRATOR_URL
        fromService:
          name: iot-orchestrator
          type: web
          property: hostport
      - key: ORCHESTRATOR_TOKEN
        fromService:
          name: iot-orchestrator
          envVarKey: BACKEND_API_TOKEN
      # Supabase (Project Settings → API)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # LLM providers (Dashboard → Environment)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Model overrides (optional; defaults in web/src/lib/models.ts)
      - key: ANTHROPIC_HAIKU_MODEL
        value: claude-haiku-4-6
      - key: ANTHROPIC_HAIKU_FALLBACK_MODEL
        value: claude-haiku-4-5-20251001
      - key: OPENAI_NANO_MODEL
        value: gpt-5.4-nano
      - key: OPENAI_NANO_FALLBACK_MODEL
        value: gpt-5.4-nano-2026-03-17
      - key: OPENAI_VISION_MODEL
        value: gpt-5.4-nano
      - key: OPENAI_STT_MODEL
        value: whisper-1

# Render Workflows are NOT Blueprint-compatible (beta).
# Create manually: Dashboard → New → Workflow → repo rootDir workflows/
# See docs/06-guide/deploy-render-workflows.md
